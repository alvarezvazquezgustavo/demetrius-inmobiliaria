# =========================================================
#  Demetrius Grupo Inmobiliario — Netlify
#  Las cabeceras de seguridad viven en el archivo _headers (una sola fuente).
#  Este archivo solo define publicación y redirecciones.
# =========================================================

[build]
  publish = "."

# ---------- 301 a HTTPS y dominio sin www ----------
[[redirects]]
  from = "http://inmobiliariademetrius.com/*"
  to = "https://inmobiliariademetrius.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.inmobiliariademetrius.com/*"
  to = "https://inmobiliariademetrius.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.inmobiliariademetrius.com/*"
  to = "https://inmobiliariademetrius.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# ---------- Archivos internos que no deben publicarse ----------
[[redirects]]
  from = "/.env*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/_headers"
  to = "/404.html"
  status = 404
  force = true

# ---------- Página 404 personalizada ----------
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
